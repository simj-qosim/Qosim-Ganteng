name: Scheduled SeaTalk Reminder

on:
  # Allows manual triggering directly from the GitHub Actions dashboard
  workflow_dispatch:
    inputs:
      reminder_choice:
        description: 'Choose manual reminder'
        required: true
        default: 'r1'
        type: choice
        options:
          - 'r1'
          - 'r2'
          - 'r3'
          - 'r4'
          - 'r5'
          - 'r6'
          - 'r7'
          - 'r8'
          - 'r9'
          - 'r10'
          - 'r11'
          - 'r12'

  # Custom event triggers specifically designed for cron-job.org
  repository_dispatch:
    types:
      - trigger_reminder1
      - trigger_reminder2
      - trigger_reminder3
      - trigger_reminder4
      - trigger_reminder5
      - trigger_reminder6
      - trigger_reminder7
      - trigger_reminder8
      - trigger_reminder9
      - trigger_reminder10
      - trigger_reminder11
      - trigger_reminder12

jobs:
  trigger-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Determine Reminder Code
      id: get_code
      run: |
        # If triggered manually via GitHub Dashboard
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "code=${{ github.event.inputs.reminder_choice }}" >> $GITHUB_OUTPUT
        
        # If triggered externally via cron-job.org webhook
        elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          case "${{ github.event.action }}" in
            trigger_reminder1)  echo "code=r1"  >> $GITHUB_OUTPUT ;;
            trigger_reminder2)  echo "code=r2"  >> $GITHUB_OUTPUT ;;
            trigger_reminder3)  echo "code=r3"  >> $GITHUB_OUTPUT ;;
            trigger_reminder4)  echo "code=r4"  >> $GITHUB_OUTPUT ;;
            trigger_reminder5)  echo "code=r5"  >> $GITHUB_OUTPUT ;;
            trigger_reminder6)  echo "code=r6"  >> $GITHUB_OUTPUT ;;
            trigger_reminder7)  echo "code=r7"  >> $GITHUB_OUTPUT ;;
            trigger_reminder8)  echo "code=r8"  >> $GITHUB_OUTPUT ;;
            trigger_reminder9)  echo "code=r9"  >> $GITHUB_OUTPUT ;;
            trigger_reminder10) echo "code=r10" >> $GITHUB_OUTPUT ;;
            trigger_reminder11) echo "code=r11" >> $GITHUB_OUTPUT ;;
            trigger_reminder12) echo "code=r12" >> $GITHUB_OUTPUT ;;
            *)                  echo "code=r1"  >> $GITHUB_OUTPUT ;;
          esac
        fi

    - name: Run Reminder Script
      env:
        SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
      run: |
        python send_reminder.py ${{ steps.get_code.outputs.code }}
